<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>06 İşlemler – Kayıtlar · masaüstü</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="{{vars}}; width: 1440px; height: 900px; display: flex; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 22px; overflow: hidden">

<aside style="width: 200px; flex: none; box-sizing: border-box; background: var(--surface); box-shadow: inset -1px 0 0 var(--border); padding: 24px 12px; display: flex; flex-direction: column; gap: 20px">
<div style="padding: 0 8px; font-size: 15px; line-height: 20px; font-weight: 600">Para Yönetimi</div>
<a href="IslemEkle.dc.html" style="display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 12px; border-radius: 12px; background: var(--accent); color: var(--onAccent); text-decoration: none; font-weight: 600"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg><span style="flex: 1">İşlem ekle</span><kbd style="font: inherit; font-size: 12px; line-height: 16px; padding: 1px 6px; border-radius: 6px; background: rgba(255,255,255,0.18)">N</kbd></a>
<nav aria-label="Ana menü" style="display: flex; flex-direction: column; gap: 2px">
<a href="OzetMasaustu.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 12px; color: var(--text2); text-decoration: none; font-weight: 500"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect width="7" height="9" x="3" y="3" rx="1"></rect><rect width="7" height="5" x="14" y="3" rx="1"></rect><rect width="7" height="9" x="14" y="12" rx="1"></rect><rect width="7" height="5" x="3" y="16" rx="1"></rect></svg>Özet</a>
<a href="#" aria-current="page" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 12px; background: color-mix(in srgb, var(--accent) 10%, transparent); color: var(--accent); text-decoration: none; font-weight: 600"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 12h.01"></path><path d="M3 18h.01"></path><path d="M3 6h.01"></path><path d="M8 12h13"></path><path d="M8 18h13"></path><path d="M8 6h13"></path></svg>İşlemler</a>
<a href="KategorilerMobil.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 12px; color: var(--text2); text-decoration: none; font-weight: 500"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8.3 10a.7.7 0 0 1-.626-1.079L11.4 3a.7.7 0 0 1 1.198-.043L16.3 8.9a.7.7 0 0 1-.572 1.1Z"></path><rect x="3" y="14" width="7" height="7" rx="1"></rect><circle cx="17.5" cy="17.5" r="3.5"></circle></svg>Kategoriler</a>
</nav>
<div style="flex: 1"></div>
<a href="AyarlarMobil.dc.html" style="display: flex; align-items: center; gap: 12px; height: 44px; padding: 0 12px; border-radius: 12px; color: var(--text2); text-decoration: none; font-weight: 500"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20 7h-9"></path><path d="M14 17H5"></path><circle cx="17" cy="17" r="3"></circle><circle cx="7" cy="7" r="3"></circle></svg>Ayarlar</a>
</aside>

<main style="flex: 1; min-width: 0; padding: 28px 60px 0; box-sizing: border-box">
<div style="max-width: 1120px; margin: 0 auto; display: flex; flex-direction: column; gap: 16px">

<header style="display: flex; align-items: center; gap: 24px; height: 48px">
<h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 600">İşlemler</h1>
<div role="tablist" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); width: 240px; background: var(--s2); border-radius: 12px; padding: 3px">
<button role="tab" aria-selected="true" style="border: 0; font: inherit; cursor: pointer; height: 36px; border-radius: 10px; background: var(--surface); color: var(--text); font-weight: 600">Kayıtlar</button>
<a href="SabitMobil.dc.html" role="tab" aria-selected="false" style="display: flex; align-items: center; justify-content: center; height: 36px; border-radius: 10px; color: var(--text2); text-decoration: none; font-weight: 500">Sabit</a>
</div>
<div style="flex: 1"></div>
<label style="width: 300px; display: flex; align-items: center; gap: 8px; height: 44px; padding: 0 10px 0 12px; box-sizing: border-box; border-radius: 12px; background: var(--surface); box-shadow: inset 0 0 0 1px var(--border); color: var(--text2)">
<svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg>
<span style="position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0)">Ara</span>
<input type="search" placeholder="Açıklama, not ya da kategori ara" style="flex: 1; min-width: 0; border: 0; outline: 0; background: none; font: inherit; font-size: 13px; color: var(--text)">
<kbd style="font: inherit; font-size: 12px; line-height: 16px; padding: 1px 6px; border-radius: 6px; background: var(--s2); color: var(--text2)">/</kbd>
</label>
</header>

<div style="display: flex; align-items: center; justify-content: space-between; gap: 16px">
<div style="display: flex; align-items: center; gap: 4px; margin-left: -12px">
<button aria-label="Önceki ay" style="border: 0; background: none; padding: 0; color: var(--text2); width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
<button style="border: 0; background: none; padding: 0 4px; font: inherit; color: var(--text); font-size: 17px; font-weight: 600; height: 44px; cursor: pointer">Ekim 2026</button>
<button aria-label="Sonraki ay" style="border: 0; background: none; padding: 0; color: var(--text2); width: 44px; height: 44px; border-radius: 12px; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
</div>
<div style="display: flex; gap: 8px; align-items: center">
<button aria-pressed="true" style="border: 0; font: inherit; cursor: pointer; height: 36px; padding: 0 14px; border-radius: 18px; background: var(--text); color: var(--bg); font-size: 13px; font-weight: 600">Tümü</button>
<button aria-pressed="false" style="border: 0; font: inherit; cursor: pointer; height: 36px; padding: 0 14px; border-radius: 18px; background: var(--surface); color: var(--text); font-size: 13px; font-weight: 500; box-shadow: inset 0 0 0 1px var(--border)">Gelir</button>
<button aria-pressed="false" style="border: 0; font: inherit; cursor: pointer; height: 36px; padding: 0 14px; border-radius: 18px; background: var(--surface); color: var(--text); font-size: 13px; font-weight: 500; box-shadow: inset 0 0 0 1px var(--border)">Gider</button>
<span aria-hidden="true" style="width: 1px; height: 20px; background: var(--border)"></span>
<button style="border: 0; font: inherit; cursor: pointer; height: 36px; padding: 0 10px 0 14px; border-radius: 18px; background: var(--surface); color: var(--text); font-size: 13px; font-weight: 500; box-shadow: inset 0 0 0 1px var(--border); display: flex; align-items: center; gap: 4px">Kategori<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true" style="color: var(--text2)"><path d="m6 9 6 6 6-6"></path></svg></button>
</div>
</div>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="5">
<section style="display: flex; flex-direction: column; gap: 4px; opacity: {{g.op}}">
<div style="display: flex; justify-content: space-between; padding: 4px 20px; font-size: 13px; line-height: 18px; font-weight: 500; color: var(--text2); font-variant-numeric: tabular-nums"><span style="font-weight: 600">{{g.title}}</span><span>{{g.net}}</span></div>
<div style="background: var(--surface); border-radius: 16px; padding: 4px 8px">
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="1">
<div style="position: relative; display: flex; align-items: center; gap: 12px; height: 64px; padding: 0 12px; border-radius: 12px; background: {{r.bg}}">
<span style="width: 40px; height: 40px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; color: {{r.color}}; background: color-mix(in srgb, {{r.color}} 16%, transparent)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><sc-for list="{{r.icon}}" as="p" hint-placeholder-count="3"><path d="{{p.d}}"></path></sc-for></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column">
<span style="display: flex; align-items: center; gap: 6px; min-width: 0"><span style="font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span>
<sc-if value="{{r.not}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Notu var" style="flex: none; color: var(--text2)"><path d="M16 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8Z"></path><path d="M15 3v4a2 2 0 0 0 2 2h4"></path></svg></sc-if>
<sc-if value="{{r.sabit}}" hint-placeholder-val="{{ false }}"><svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" role="img" aria-label="Sabit işlem" style="flex: none; color: var(--text2)"><path d="m17 2 4 4-4 4"></path><path d="M3 11v-1a4 4 0 0 1 4-4h14"></path><path d="m7 22-4-4 4-4"></path><path d="M21 13v1a4 4 0 0 1-4 4H3"></path></svg></sc-if>
</span>
<span style="font-size: 13px; line-height: 18px; font-weight: 500; color: var(--text2)">{{r.cat}}</span>
</span>
<span style="font-size: 16px; line-height: 22px; font-weight: 600; color: {{r.ac}}; font-variant-numeric: tabular-nums">{{r.amount}}</span>
<sc-if value="{{r.hover}}" hint-placeholder-val="{{ false }}">
<button aria-label="Diğer eylemler" style="border: 0; cursor: pointer; width: 36px; height: 36px; border-radius: 10px; background: var(--surface); color: var(--text2); display: flex; align-items: center; justify-content: center"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="12" r="1"></circle><circle cx="19" cy="12" r="1"></circle><circle cx="5" cy="12" r="1"></circle></svg></button>
<div role="tooltip" style="position: absolute; left: 160px; bottom: 54px; width: 260px; background: var(--toast); color: var(--onToast); border-radius: 10px; padding: 8px 12px; font-size: 13px; line-height: 18px; font-weight: 500; box-shadow: 0 6px 16px var(--shadow); z-index: 2">Ayşe'nin doğum günü. Hesabı üç kişi böldük, payıma düşen bu.</div>
</sc-if>
<sc-if value="{{r.noHover}}" hint-placeholder-val="{{ true }}"><span style="width: 36px; flex: none"></span></sc-if>
</div>
</sc-for>
</div>
</section>
</sc-for>
</div>
</main>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"$preview":{"width":1440,"height":900}}'>
class Component extends DCLogic {
  renderVals() {
    const T = {
      light: { bg:'#F7F7F5', surface:'#FFFFFF', s2:'#F0EFEC', border:'#E6E4DF', text:'#1C1B19', text2:'#6B6862', accent:'#3D4ED8', onAccent:'#FFFFFF', shadow:'rgba(28,27,25,0.18)', inc:'#237A4B', exp:'#C2453A', toast:'#1C1B19', onToast:'#F2F1EE',
        'c-gul':'#D14D72', 'c-mor':'#8257D1', 'c-mavi':'#3478BE', 'c-camgobegi':'#16999C', 'c-hardal':'#AE8B1F', 'c-amber':'#CF7F12', 'c-turuncu':'#D9662F' },
      dark: { bg:'#111214', surface:'#1A1B1E', s2:'#232428', border:'#2C2D31', text:'#F2F1EE', text2:'#A3A19B', accent:'#8C98FF', onAccent:'#111214', shadow:'rgba(0,0,0,0.55)', inc:'#6FD39A', exp:'#FF8A7A', toast:'#F2F1EE', onToast:'#1C1B19',
        'c-gul':'#EC7898', 'c-mor':'#A98BEE', 'c-mavi':'#64A4E2', 'c-camgobegi':'#45C4C6', 'c-hardal':'#D6B550', 'c-amber':'#EDA748', 'c-turuncu':'#F28D5C' }
    };
    const t = T[this.props.theme === 'dark' ? 'dark' : 'light'];
    const vars = Object.keys(t).map((k) => '--' + k + ': ' + t[k]).join('; ');
    const P = (a) => a.map((d) => ({ d }));
    const I = {
      receipt: P(['M4 2v20l2-1 2 1 2-1 2 1 2-1 2 1 2-1 2 1V2l-2 1-2-1-2 1-2-1-2 1-2-1-2 1Z', 'M16 8h-6a2 2 0 1 0 0 4h4a2 2 0 1 1 0 4H8', 'M12 17.5v-11']),
      monitor: P(['M4 3h16a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2z', 'M10 7.75a.75.75 0 0 1 1.142-.638l3.664 2.249a.75.75 0 0 1 0 1.278l-3.664 2.25a.75.75 0 0 1-1.142-.64z', 'M12 17v4', 'M8 21h8']),
      cart: P(['M7 21a1 1 0 1 0 2 0a1 1 0 1 0 -2 0', 'M18 21a1 1 0 1 0 2 0a1 1 0 1 0 -2 0', 'M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12']),
      heart: P(['M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z', 'M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27']),
      utensils: P(['M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2', 'M7 2v20', 'M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7']),
      bus: P(['M8 6v6', 'M15 6v6', 'M2 12h19.6', 'M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3', 'M5 18a2 2 0 1 0 4 0a2 2 0 1 0 -4 0', 'M9 18h5', 'M14 18a2 2 0 1 0 4 0a2 2 0 1 0 -4 0']),
      coins: P(['M2 8a6 6 0 1 0 12 0a6 6 0 1 0 -12 0', 'M18.09 10.37A6 6 0 1 1 10.34 18', 'M7 6h1v4', 'm16.71 13.88.7.71-2.82 2.82'])
    };
    const row = (name, cat, amount, icon, color, opt) => Object.assign({ name, cat, amount, icon: I[icon], color: 'var(--c-' + color + ')', ac: 'var(--exp)', not: false, sabit: false, hover: false, noHover: true, bg: 'transparent' }, opt || {});
    const groups = [
      { title: 'Planlanan', net: '3 işlem · toplama girmez', op: 0.55, rows: [
        row('İnternet', 'Faturalar · 25 Eki', '−₺450,00', 'receipt', 'amber', { sabit: true }),
        row('Müzik aboneliği', 'Abonelikler · 28 Eki', '−₺99,00', 'monitor', 'mor', { sabit: true }),
        row('Telefon faturası', 'Faturalar · 30 Eki', '−₺350,00', 'receipt', 'amber', { sabit: true })
      ] },
      { title: 'Bugün', net: '−₺340,00', op: 1, rows: [row('Migros', 'Market', '−₺340,00', 'cart', 'turuncu')] },
      { title: '16 Ekim Cuma', net: '−₺230,00', op: 1, rows: [row('Eczane', 'Sağlık', '−₺230,00', 'heart', 'camgobegi')] },
      { title: '15 Ekim Perşembe', net: '−₺720,00', op: 1, rows: [row('Akşam yemeği', 'Yemek', '−₺720,00', 'utensils', 'gul', { not: true, hover: true, noHover: false, bg: 'var(--s2)' })] },
      { title: '14 Ekim Çarşamba', net: '−₺130,00', op: 1, rows: [row('Ulaşım kartı', 'Ulaşım', '−₺130,00', 'bus', 'mavi', { sabit: true })] },
      { title: '13 Ekim Salı', net: '−₺410,00', op: 1, rows: [row('Haftalık pazar', 'Market', '−₺410,00', 'cart', 'turuncu')] },
      { title: '12 Ekim Pazartesi', net: '+₺2.215,00', op: 1, rows: [
        row('Çeviri işi', 'Ek gelir', '+₺2.500,00', 'coins', 'hardal', { ac: 'var(--inc)' }),
        row('Taksi', 'Ulaşım', '−₺285,00', 'bus', 'mavi')
      ] }
    ];
    return { vars, groups };
  }
}
</script>
</body>
</html>
