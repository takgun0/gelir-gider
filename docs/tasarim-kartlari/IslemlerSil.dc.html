<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<title>İşlemler · kaydırarak silme</title>
<script src="./support.js"></script>
</head>
<body>
<x-dc>
<helmet>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&amp;display=swap" rel="stylesheet">
<style>
body{margin:0}
</style>
</helmet>
<div style="{{vars}}; width: 390px; height: 844px; position: relative; overflow: hidden; background: var(--bg); color: var(--text); font-family: Inter, system-ui, sans-serif; font-size: 15px; line-height: 22px">
<main style="display: flex; flex-direction: column; gap: 12px; padding: 16px 16px 120px">
<h1 style="margin: 0; font-size: 22px; line-height: 28px; font-weight: 600">İşlemler</h1>
<div role="tablist" style="display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); background: var(--s2); border-radius: 12px; padding: 3px">
<button role="tab" aria-selected="true" style="border: 0; font: inherit; cursor: pointer; height: 38px; border-radius: 10px; background: var(--surface); color: var(--text); font-weight: 600">Kayıtlar</button>
<a href="SabitMobil.dc.html" role="tab" aria-selected="false" style="display: flex; align-items: center; justify-content: center; height: 38px; border-radius: 10px; color: var(--text2); text-decoration: none; font-weight: 500">Sabit</a>
</div>
<div style="display: flex; align-items: center; justify-content: space-between; height: 44px">
<div style="display: flex; align-items: center; gap: 4px; margin-left: -12px">
<button aria-label="Önceki ay" style="border: 0; background: none; padding: 0; color: var(--text2); width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m15 18-6-6 6-6"></path></svg></button>
<button style="border: 0; background: none; padding: 0 4px; font: inherit; color: var(--text); font-size: 17px; font-weight: 600; height: 44px; cursor: pointer">Ekim 2026</button>
<button aria-label="Sonraki ay" style="border: 0; background: none; padding: 0; color: var(--text2); width: 44px; height: 44px; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m9 18 6-6-6-6"></path></svg></button>
</div>
<button aria-label="Ara" style="border: 0; background: none; padding: 0; color: var(--text2); width: 44px; height: 44px; margin-right: -10px; display: flex; align-items: center; justify-content: center; cursor: pointer"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="11" cy="11" r="8"></circle><path d="m21 21-4.3-4.3"></path></svg></button>
</div>

<sc-for list="{{groups}}" as="g" hint-placeholder-count="4">
<section style="display: flex; flex-direction: column; gap: 4px">
<div style="display: flex; justify-content: space-between; padding: 8px 4px 4px; font-size: 13px; line-height: 18px; font-weight: 500; color: var(--text2); font-variant-numeric: tabular-nums"><span style="font-weight: 600">{{g.title}}</span><span>{{g.net}}</span></div>
<div style="background: var(--surface); border-radius: 16px; overflow: hidden">
<sc-for list="{{g.rows}}" as="r" hint-placeholder-count="1">
<div style="position: relative; height: 64px; overflow: hidden">
<button aria-label="Sil" style="position: absolute; top: 0; right: 0; bottom: 0; width: 88px; border: 0; background: var(--exp); color: var(--onExp); font: inherit; font-size: 13px; font-weight: 600; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 2px; cursor: pointer"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 6h18"></path><path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path><path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path></svg>Sil</button>
<div style="position: absolute; inset: 0; background: var(--surface); padding: 0 16px; display: flex; align-items: center; gap: 12px; transform: translateX({{r.tx}}px)">
<span style="width: 40px; height: 40px; border-radius: 50%; flex: none; display: flex; align-items: center; justify-content: center; color: {{r.color}}; background: color-mix(in srgb, {{r.color}} 16%, transparent)"><svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><sc-for list="{{r.icon}}" as="p" hint-placeholder-count="3"><path d="{{p.d}}"></path></sc-for></svg></span>
<span style="flex: 1; min-width: 0; display: flex; flex-direction: column"><span style="font-weight: 500; white-space: nowrap; overflow: hidden; text-overflow: ellipsis">{{r.name}}</span><span style="font-size: 13px; line-height: 18px; font-weight: 500; color: var(--text2)">{{r.cat}}</span></span>
<span style="font-size: 16px; line-height: 22px; font-weight: 600; color: var(--exp); font-variant-numeric: tabular-nums">{{r.amount}}</span>
</div>
</div>
</sc-for>
</div>
</section>
</sc-for>
</main>

<sc-if value="{{silindi}}" hint-placeholder-val="{{ false }}">
<div role="status" style="position: absolute; left: 16px; right: 16px; bottom: 98px; background: var(--toast); color: var(--onToast); border-radius: 12px; padding: 4px 4px 4px 16px; display: flex; align-items: center; gap: 8px; box-shadow: 0 8px 24px var(--shadow); font-weight: 500">
<span style="flex: 1">İşlem silindi</span>
<button style="border: 0; background: none; font: inherit; color: var(--toastAccent); font-weight: 600; height: 44px; padding: 0 14px; border-radius: 10px; cursor: pointer">Geri al</button>
</div>
</sc-if>

<nav aria-label="Ana menü" style="position: absolute; left: 0; right: 0; bottom: 0; background: var(--surface); box-shadow: inset 0 1px 0 var(--border); padding: 6px 4px 24px; display: grid; grid-template-columns: repeat(5, minmax(0, 1fr)); align-items: end">
<sc-for list="{{navL}}" as="n" hint-placeholder-count="2">
<a href="{{n.href}}" style="display: flex; flex-direction: column; align-items: center; gap: 2px; height: 52px; justify-content: center; text-decoration: none; color: {{n.color}}; font-size: 12px; line-height: 16px; font-weight: {{n.weight}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><sc-for list="{{n.icon}}" as="p" hint-placeholder-count="4"><path d="{{p.d}}"></path></sc-for></svg>{{n.label}}</a>
</sc-for>
<div style="display: flex; justify-content: center; height: 52px; align-items: flex-start">
<a href="IslemEkle.dc.html" aria-label="İşlem ekle" style="width: 56px; height: 56px; margin-top: -22px; border-radius: 50%; background: var(--accent); color: var(--onAccent); display: flex; align-items: center; justify-content: center; box-shadow: 0 6px 16px var(--shadow)"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.25" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14"></path><path d="M12 5v14"></path></svg></a>
</div>
<sc-for list="{{navR}}" as="n" hint-placeholder-count="2">
<a href="{{n.href}}" style="display: flex; flex-direction: column; align-items: center; gap: 2px; height: 52px; justify-content: center; text-decoration: none; color: {{n.color}}; font-size: 12px; line-height: 16px; font-weight: {{n.weight}}"><svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.75" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><sc-for list="{{n.icon}}" as="p" hint-placeholder-count="4"><path d="{{p.d}}"></path></sc-for></svg>{{n.label}}</a>
</sc-for>
</nav>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script data-props='{"theme":{"editor":"enum","options":["light","dark"],"default":"light"},"asama":{"editor":"enum","options":["kaydir","silindi"],"default":"kaydir"},"$preview":{"width":390,"height":844}}'>
class Component extends DCLogic {
  renderVals() {
    const T = {
      light: { bg:'#F7F7F5', surface:'#FFFFFF', s2:'#F0EFEC', border:'#E6E4DF', text:'#1C1B19', text2:'#6B6862', accent:'#3D4ED8', onAccent:'#FFFFFF', shadow:'rgba(28,27,25,0.18)', exp:'#C2453A', onExp:'#FFFFFF', toast:'#1C1B19', onToast:'#F2F1EE', toastAccent:'#8C98FF',
        'c-gul':'#D14D72', 'c-mavi':'#3478BE', 'c-camgobegi':'#16999C', 'c-turuncu':'#D9662F' },
      dark: { bg:'#111214', surface:'#1A1B1E', s2:'#232428', border:'#2C2D31', text:'#F2F1EE', text2:'#A3A19B', accent:'#8C98FF', onAccent:'#111214', shadow:'rgba(0,0,0,0.55)', exp:'#FF8A7A', onExp:'#111214', toast:'#F2F1EE', onToast:'#1C1B19', toastAccent:'#3D4ED8',
        'c-gul':'#EC7898', 'c-mavi':'#64A4E2', 'c-camgobegi':'#45C4C6', 'c-turuncu':'#F28D5C' }
    };
    const t = T[this.props.theme === 'dark' ? 'dark' : 'light'];
    const vars = Object.keys(t).map((k) => '--' + k + ': ' + t[k]).join('; ');
    const P = (a) => a.map((d) => ({ d }));
    const I = {
      cart: P(['M7 21a1 1 0 1 0 2 0a1 1 0 1 0 -2 0', 'M18 21a1 1 0 1 0 2 0a1 1 0 1 0 -2 0', 'M2.05 2.05h2l2.66 12.42a2 2 0 0 0 2 1.58h9.78a2 2 0 0 0 1.95-1.57l1.65-7.43H5.12']),
      heart: P(['M19 14c1.49-1.46 3-3.21 3-5.5A5.5 5.5 0 0 0 16.5 3c-1.76 0-3 .5-4.5 2-1.5-1.5-2.74-2-4.5-2A5.5 5.5 0 0 0 2 8.5c0 2.3 1.5 4.05 3 5.5l7 7Z', 'M3.22 12H9.5l.5-1 2 4.5 2-7 1.5 3.5h5.27']),
      utensils: P(['M3 2v7c0 1.1.9 2 2 2h4a2 2 0 0 0 2-2V2', 'M7 2v20', 'M21 15V2a5 5 0 0 0-5 5v6c0 1.1.9 2 2 2h3Zm0 0v7']),
      bus: P(['M8 6v6', 'M15 6v6', 'M2 12h19.6', 'M18 18h3s.5-1.7.8-2.8c.1-.4.2-.8.2-1.2 0-.4-.1-.8-.2-1.2l-1.4-5C20.1 6.8 19.1 6 18 6H4a2 2 0 0 0-2 2v10h3', 'M5 18a2 2 0 1 0 4 0a2 2 0 1 0 -4 0', 'M9 18h5', 'M14 18a2 2 0 1 0 4 0a2 2 0 1 0 -4 0'])
    };
    const silindi = this.props.asama === 'silindi';
    const row = (name, cat, amount, icon, color, tx) => ({ name, cat, amount, icon: I[icon], color: 'var(--c-' + color + ')', tx: tx || 0 });
    let groups = [
      { title: 'Bugün', net: '−₺340,00', rows: [row('Migros', 'Market', '−₺340,00', 'cart', 'turuncu')] },
      { title: '16 Ekim Cuma', net: '−₺230,00', rows: [row('Eczane', 'Sağlık', '−₺230,00', 'heart', 'camgobegi', -88)] },
      { title: '15 Ekim Perşembe', net: '−₺720,00', rows: [row('Akşam yemeği', 'Yemek', '−₺720,00', 'utensils', 'gul')] },
      { title: '14 Ekim Çarşamba', net: '−₺130,00', rows: [row('Ulaşım kartı', 'Ulaşım', '−₺130,00', 'bus', 'mavi')] },
      { title: '13 Ekim Salı', net: '−₺410,00', rows: [row('Haftalık pazar', 'Market', '−₺410,00', 'cart', 'turuncu')] }
    ];
    if (silindi) groups = groups.filter((g) => g.title !== '16 Ekim Cuma');

    const N = {
      ozet: P(['M4 3h5a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z', 'M15 3h5a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1V4a1 1 0 0 1 1-1z', 'M15 12h5a1 1 0 0 1 1 1v7a1 1 0 0 1-1 1h-5a1 1 0 0 1-1-1v-7a1 1 0 0 1 1-1z', 'M4 16h5a1 1 0 0 1 1 1v3a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-3a1 1 0 0 1 1-1z']),
      islem: P(['M3 12h.01', 'M3 18h.01', 'M3 6h.01', 'M8 12h13', 'M8 18h13', 'M8 6h13']),
      kat: P(['M8.3 10a.7.7 0 0 1-.626-1.079L11.4 3a.7.7 0 0 1 1.198-.043L16.3 8.9a.7.7 0 0 1-.572 1.1Z', 'M4 14h5a1 1 0 0 1 1 1v5a1 1 0 0 1-1 1H4a1 1 0 0 1-1-1v-5a1 1 0 0 1 1-1z', 'M14 17.5a3.5 3.5 0 1 0 7 0a3.5 3.5 0 1 0 -7 0']),
      ayar: P(['M20 7h-9', 'M14 17H5', 'M14 17a3 3 0 1 0 6 0a3 3 0 1 0 -6 0', 'M4 7a3 3 0 1 0 6 0a3 3 0 1 0 -6 0'])
    };
    const nav = [['Özet', 'ozet', 'Main.dc.html'], ['İşlemler', 'islem', 'IslemlerMobil.dc.html'], ['Kategoriler', 'kat', 'KategorilerMobil.dc.html'], ['Ayarlar', 'ayar', 'AyarlarMobil.dc.html']]
      .map((n, i) => ({ label: n[0], icon: N[n[1]], href: n[2], color: i === 1 ? 'var(--accent)' : 'var(--text2)', weight: i === 1 ? 600 : 500 }));

    return { vars, groups, silindi, navL: nav.slice(0, 2), navR: nav.slice(2) };
  }
}
</script>
</body>
</html>
